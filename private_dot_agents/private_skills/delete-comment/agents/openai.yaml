interface:
  display_name: "Delete Comment"
  short_description: "Sort, delete, and ratchet down code comments."
  default_prompt: "Use $delete-comment to audit the comments in the files with the highest baseline: sort each as tautology, stale, excuse, or decision record, move decision records into docs/adr/, draft issues for excuses, then run scripts/comment-ratchet.py --update and --check."
