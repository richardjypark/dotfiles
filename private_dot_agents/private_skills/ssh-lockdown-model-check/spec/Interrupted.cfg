\* Baseline, but the lockdown run can stop between any two commands (Ctrl-C,
\* or the first SSH session drops and the shell sends SIGHUP).
CONSTANTS
    BasePort = 22
    PriorPort = 2200
    NewPort = 22
    PriorDropin = "prior"
    PriorOpen = {2200}
    PriorUfwActive = TRUE
    StopElapsedTimer = {"fail"}
    AllowInterrupt = TRUE
