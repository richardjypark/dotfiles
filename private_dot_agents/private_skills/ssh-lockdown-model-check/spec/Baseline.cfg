\* A server that was locked down before on port 2200 and is now locked down on
\* port 22. systemd unloads a transient timer once it fires, so `systemctl
\* stop` on it fails. The run is never interrupted.
CONSTANTS
    BasePort = 22
    PriorPort = 2200
    NewPort = 22
    PriorDropin = "prior"
    PriorOpen = {2200}
    PriorUfwActive = TRUE
    StopElapsedTimer = {"fail"}
    AllowInterrupt = FALSE
