# Stage 1: manual, report only. Add a schedule and publisher only after the
# retired host timers and branch protection are verified in a later review.
name: safe-daily-updates-report

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CHEZMOI_AUTOMATIC_UPDATES: '1'
      CHEZMOI_NPM_MIN_VERSION_AGE_DAYS: '7'
      npm_config_ignore_scripts: 'true'
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Test offline release policy and timer migration
        run: python3 tests/test_safe_daily_updates.py
      - name: Resolve fresh seven-day candidates without source edits
        env:
          CHEZMOI_DIR: ${{ github.workspace }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash dot_local/bin/executable_chezmoi-bump --automatic --all --check
      - name: Show staged policy
        run: |
          printf '%s\n' 'Report only: no schedule, branch write, PR, or host apply.'
          printf '%s\n' 'Publication requires retired host timers and verified branch rules.'
