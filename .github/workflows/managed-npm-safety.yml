name: repository-validation

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  validation:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-26
    runs-on: ${{ matrix.os }}
    env:
      npm_config_ignore_scripts: true
      npm_config_fund: false
      npm_config_audit: false
      npm_config_replace_registry_host: always
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve pinned chezmoi artifact
        id: chezmoi
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from pathlib import Path

          pinned = {}
          in_section = False
          for raw_line in Path(".chezmoidata.toml").read_text().splitlines():
              line = raw_line.strip()
              if line == "[pinned.chezmoi]":
                  in_section = True
                  continue
              if in_section and line.startswith("["):
                  break
              if in_section and line and not line.startswith("#"):
                  key, value = line.split("=", 1)
                  pinned[key.strip()] = value.strip().strip('"')

          platform = (os.environ["RUNNER_OS"], os.environ["RUNNER_ARCH"])
          artifacts = {
              ("Linux", "X64"): ("linux_amd64", "linux_x86_64_sha256"),
              ("Linux", "ARM64"): ("linux_arm64", "linux_arm64_sha256"),
              ("macOS", "X64"): ("darwin_amd64", "macos_x86_64_sha256"),
              ("macOS", "ARM64"): ("darwin_arm64", "macos_arm64_sha256"),
          }
          artifact, checksum_key = artifacts[platform]
          version = pinned["version"]
          print(f"version={version}")
          print(f"archive=chezmoi_{version}_{artifact}.tar.gz")
          print(f"sha256={pinned[checksum_key]}")
          PY

      - name: Install pinned chezmoi
        shell: bash
        env:
          CHEZMOI_VERSION: ${{ steps.chezmoi.outputs.version }}
          CHEZMOI_ARCHIVE: ${{ steps.chezmoi.outputs.archive }}
          CHEZMOI_SHA256: ${{ steps.chezmoi.outputs.sha256 }}
        run: |
          install_dir="$RUNNER_TEMP/chezmoi-bin"
          archive_path="$RUNNER_TEMP/$CHEZMOI_ARCHIVE"
          mkdir -p "$install_dir"
          curl --fail --location --silent --show-error \
            --output "$archive_path" \
            "https://github.com/twpayne/chezmoi/releases/download/v${CHEZMOI_VERSION}/${CHEZMOI_ARCHIVE}"
          printf '%s  %s\n' "$CHEZMOI_SHA256" "$archive_path" | shasum -a 256 --check
          tar -xzf "$archive_path" -C "$install_dir" chezmoi
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"

      - name: Set up Node.js
        if: runner.os == 'Linux'
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: |
            dot_local/share/pi-cli/package-lock.json
            dot_local/share/pi-maintenance-agent/package-lock.json
            dot_local/share/openrouter-agent/package-lock.json

      - name: Install managed Pi CLI dependencies
        if: runner.os == 'Linux'
        working-directory: dot_local/share/pi-cli
        run: npm ci --ignore-scripts --no-fund --no-audit --omit=dev

      - name: Install managed Pi maintenance agent dependencies
        if: runner.os == 'Linux'
        working-directory: dot_local/share/pi-maintenance-agent
        run: npm ci --ignore-scripts --no-fund --no-audit --omit=dev

      - name: Install OpenRouter agent dependencies
        if: runner.os == 'Linux'
        working-directory: dot_local/share/openrouter-agent
        run: npm ci --ignore-scripts --no-fund --no-audit --include=dev

      - name: Run full validation
        if: runner.os == 'Linux'
        run: REQUIRE_MANAGED_NPM_TESTS=1 ./tests/all

      - name: Run portable core validation
        if: runner.os == 'macOS'
        run: ./tests/all
