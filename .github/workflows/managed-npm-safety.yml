name: repository-validation

on:
  pull_request:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run. Other runs never share a group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validation:
    strategy:
      fail-fast: false
      matrix:
        # A push to the default branch has the tree that its pull request
        # already tested (the required checks are strict). It runs only the
        # Linux job, which saves the caches that pull requests restore.
        os: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-24.04"]' || '["ubuntu-24.04", "macos-26"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      npm_config_ignore_scripts: true
      npm_config_fund: false
      npm_config_audit: false
      npm_config_replace_registry_host: always
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tests need only yaml.safe_load, which PyYAML's pure-Python package
      # provides. The pinned source archive is checked and unpacked; no
      # installer or build code runs.
      - name: Install Hermes config test dependency
        shell: bash
        run: |
          yaml_path="$(bash tests/lib/pyyaml-path.sh "$RUNNER_TEMP/pyyaml")"
          printf 'PYTHONPATH=%s\n' "$yaml_path" >> "$GITHUB_ENV"

      - name: Install verified jj for publication tests
        shell: bash
        run: |
          python3 scripts/check-maintenance-candidate.py install-jj --base "$GITHUB_SHA" \
            --destination "$RUNNER_TEMP/maintenance-tools"
          printf '%s\n' "$RUNNER_TEMP/maintenance-tools" >> "$GITHUB_PATH"

      - name: Resolve pinned chezmoi artifact
        id: chezmoi
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from pathlib import Path

          pinned = {}
          in_section = False
          for raw_line in Path(".chezmoidata.toml").read_text().splitlines():
              line = raw_line.strip()
              if line == "[pinned.chezmoi]":
                  in_section = True
                  continue
              if in_section and line.startswith("["):
                  break
              if in_section and line and not line.startswith("#"):
                  key, value = line.split("=", 1)
                  pinned[key.strip()] = value.strip().strip('"')

          platform = (os.environ["RUNNER_OS"], os.environ["RUNNER_ARCH"])
          artifacts = {
              ("Linux", "X64"): ("linux_amd64", "linux_x86_64_sha256"),
              ("Linux", "ARM64"): ("linux_arm64", "linux_arm64_sha256"),
              ("macOS", "X64"): ("darwin_amd64", "macos_x86_64_sha256"),
              ("macOS", "ARM64"): ("darwin_arm64", "macos_arm64_sha256"),
          }
          artifact, checksum_key = artifacts[platform]
          version = pinned["version"]
          print(f"version={version}")
          print(f"archive=chezmoi_{version}_{artifact}.tar.gz")
          print(f"sha256={pinned[checksum_key]}")
          PY

      - name: Install pinned chezmoi
        shell: bash
        env:
          CHEZMOI_VERSION: ${{ steps.chezmoi.outputs.version }}
          CHEZMOI_ARCHIVE: ${{ steps.chezmoi.outputs.archive }}
          CHEZMOI_SHA256: ${{ steps.chezmoi.outputs.sha256 }}
        run: |
          install_dir="$RUNNER_TEMP/chezmoi-bin"
          archive_path="$RUNNER_TEMP/$CHEZMOI_ARCHIVE"
          mkdir -p "$install_dir"
          curl --fail --location --silent --show-error \
            --output "$archive_path" \
            "https://github.com/twpayne/chezmoi/releases/download/v${CHEZMOI_VERSION}/${CHEZMOI_ARCHIVE}"
          printf '%s  %s\n' "$CHEZMOI_SHA256" "$archive_path" | shasum -a 256 --check
          tar -xzf "$archive_path" -C "$install_dir" chezmoi
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"

      - name: Set up Node.js
        if: runner.os == 'Linux'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: |
            dot_local/share/pi-cli/package-lock.json
            dot_local/share/pi-maintenance-agent/package-lock.json
            dot_local/share/openrouter-agent/package-lock.json

      # The Ubuntu mirror is slow and uneven, so the packages are cached. A
      # cached package installs only if it matches the SHA256 committed in
      # the list; apt does not check files it finds in a cache folder.
      - name: Restore shell test packages on Linux
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: shell-test-debs-${{ hashFiles('.github/tools/shell-test-debs.sha256') }}

      - name: Install shell test tools on Linux
        if: runner.os == 'Linux'
        run: |
          list="$GITHUB_WORKSPACE/.github/tools/shell-test-debs.sha256"
          dir="$HOME/apt-debs"
          mapfile -t specs < <(awk '{ split($2, p, "_"); print p[1] "=" p[2] }' "$list")
          mapfile -t debs < <(awk -v dir="$dir" '{ print dir "/" $2 }' "$list")
          if ! (cd "$dir" 2>/dev/null && sha256sum --check --strict --quiet "$list"); then
            rm -rf "$dir"
            mkdir -p "$dir"
            sudo apt-get update -qq
            (cd "$dir" && apt-get download -qq "${specs[@]}")
            (cd "$dir" && sha256sum --check --strict "$list")
          fi
          sudo dpkg -i "${debs[@]}" > /dev/null
          command -v shellcheck > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y shellcheck; }

      # ShellCheck and actionlint run in the Linux job, which also lints the
      # macOS rendering of every template.
      - name: Install shell test tools on macOS
        if: runner.os == 'macOS'
        run: brew install ripgrep

      - name: Set up Go for actionlint
        if: runner.os == 'Linux'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache-dependency-path: .github/tools/go.sum

      - name: Install actionlint on Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          (cd .github/tools && GOBIN="$RUNNER_TEMP/actionlint-bin" go install github.com/rhysd/actionlint/cmd/actionlint)
          printf '%s\n' "$RUNNER_TEMP/actionlint-bin" >> "$GITHUB_PATH"

      - name: Install managed Pi CLI dependencies
        if: runner.os == 'Linux'
        working-directory: dot_local/share/pi-cli
        run: |
          source "$GITHUB_WORKSPACE/dot_local/private_lib/chezmoi-helpers.sh"
          NPM_CMD="$(command -v npm)"
          export NPM_CMD
          TRUST_ON_FIRST_USE_INSTALLERS=1 run_managed_npm_ci "$PWD"

      - name: Install managed Pi maintenance agent dependencies
        if: runner.os == 'Linux'
        working-directory: dot_local/share/pi-maintenance-agent
        run: |
          source "$GITHUB_WORKSPACE/dot_local/private_lib/chezmoi-helpers.sh"
          NPM_CMD="$(command -v npm)"
          export NPM_CMD
          TRUST_ON_FIRST_USE_INSTALLERS=1 run_managed_npm_ci "$PWD"

      - name: Install OpenRouter agent dependencies
        if: runner.os == 'Linux'
        working-directory: dot_local/share/openrouter-agent
        run: npm ci --ignore-scripts --no-fund --no-audit --include=dev

      - name: Run full validation
        if: runner.os == 'Linux'
        run: REQUIRE_MANAGED_NPM_TESTS=1 REQUIRE_LINT_TOOLS=1 ./tests/all

      - name: Run portable core validation
        if: runner.os == 'macOS'
        run: TESTS_PLATFORM_ONLY=1 ./tests/all
