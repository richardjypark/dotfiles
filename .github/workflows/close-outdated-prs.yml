# Closes open pull requests that the base branch already contains or that have
# had no activity for 30 days. Inactive Dependabot pull requests stay open. It
# reads pull request heads as Git data and runs no pull request code. Add the
# keep-open label to keep a pull request open.
name: close-outdated-prs

on:
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:
    inputs:
      close:
        description: Close outdated pull requests (the default only reports them)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: close-outdated-prs
  cancel-in-progress: false

jobs:
  close:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Close superseded and inactive pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          CLOSE: ${{ github.event_name == 'schedule' || inputs.close }}
        run: |
          args=(--stale-days 30 --summary "$GITHUB_STEP_SUMMARY")
          if [ "$CLOSE" = true ]; then args+=(--apply); fi
          python3 scripts/close-outdated-prs.py "${args[@]}"
