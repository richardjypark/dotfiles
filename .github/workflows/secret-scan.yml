name: secret-scan

on:
  pull_request:
  push:
    branches:
      - '**'
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: v8.30.1
    steps:
      - name: Check out full repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check public files and new commit identities
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          base="$EVENT_BASE"
          # A force push leaves the old branch tip outside the fetched history.
          # The merge base then checks every commit that is not on the default branch.
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git merge-base HEAD "refs/remotes/origin/$DEFAULT_BRANCH")"
          fi
          python3 scripts/check-public-files.py --base "$base"

      - name: Set up Go for gitleaks install
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.24.x'
          cache: false

      - name: Install gitleaks
        run: |
          go install "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Scan full Git history
        run: gitleaks git --log-opts="--all" . --redact=100 --no-banner --log-level warn

      - name: Scan checked-out worktree
        run: gitleaks dir . --redact=100 --no-banner --log-level warn
