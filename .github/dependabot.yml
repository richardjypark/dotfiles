version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: chore(ci)
  # gitleaks and actionlint for CI. tools.go keeps them direct requirements,
  # because Dependabot does not update Go tool directives.
  - package-ecosystem: gomod
    directory: /.github/tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      ci-tools:
        patterns: ['*']
    commit-message:
      prefix: chore(ci)
  - package-ecosystem: npm
    directory: /dot_local/share/openrouter-agent
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    versioning-strategy: increase
    open-pull-requests-limit: 3
    ignore:
      # Every @openrouter/agent release up to 0.11.0 requires @openrouter/sdk
      # ^0.13.7. Remove this rule when an agent release accepts the new major.
      - dependency-name: '@openrouter/sdk'
        update-types: ['version-update:semver-major']
      # Change the Node types major only with the Node runtime major.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      # The agent and SDK versions must move together.
      openrouter:
        patterns: ['@openrouter/*']
      application-non-major:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: chore
  # Pi versions are coordinated by chezmoi-bump; keep security proposals active.
  - package-ecosystem: npm
    directories:
      - /dot_local/share/pi-cli
      - /dot_local/share/pi-maintenance-agent
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
