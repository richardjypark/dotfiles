version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /dot_local/share/openrouter-agent
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    versioning-strategy: increase
    open-pull-requests-limit: 3
    groups:
      application-patches:
        patterns: ['*']
        update-types: [patch]
    commit-message:
      prefix: chore
  # Pi versions are coordinated by chezmoi-bump; keep security proposals active.
  - package-ecosystem: npm
    directories:
      - /dot_local/share/pi-cli
      - /dot_local/share/pi-maintenance-agent
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
